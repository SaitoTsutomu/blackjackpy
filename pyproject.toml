[project]
authors = [{name = "Saito Tsutomu", email = "tsutomu7@hotmail.co.jp"}]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering",
]
dependencies = []
description = "Blackjack game"
license = "Apache-2.0"
license-files = ["LICENSE*"]
name = "blackjackpy"
readme = "README.md"
requires-python = ">=3.14"
version = "0.4.0"

[project.urls]
docs = "https://saitotsutomu.github.io/blackjackpy/"
homepage = "https://github.com/SaitoTsutomu/blackjackpy"

[project.scripts]
blackjackpy = "blackjackpy:main"

[dependency-groups]
dev = [
  "more-itertools>=11.1",
  "pytest>=9.1",
]

[tool.taskipy.tasks]
license = "uv run -w pip-licenses pip-licenses"
lint = "pyrefly check src && ruff check src"
test = "uv run pytest --disable-warnings"

[tool.uv]
exclude-newer = "3 days"

[[tool.uv.index]]
default = true
url = "https://pypi.flatt.tech/simple/"

[tool.pytest.ini_options]
norecursedirs = ["nbs"]
pythonpath = ["src"]

[tool.pyrefly]
project-includes = ["src"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
ignore = [
  "any-type",
  "missing-copyright-notice",
  "D10",
  "incorrect-blank-line-before-class",
  "multi-line-summary-second-line",
  "missing-trailing-period",
  "missing-terminal-punctuation",
  "DOC",
  "line-too-long",
]
preview = true
select = ["ALL"]

[tool.ruff.lint.extend-per-file-ignores]
"*/tests/*.py" = ["assert"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.0,<0.13.0"]
