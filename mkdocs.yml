site_name: BlackJack
repo_url: https://github.com/SaitoTsutomu/blackjackpy

theme:
  name: "material"
  language: ja

markdown_extensions:
  - codehilite:
      noclasses: true
      pygments_style: colorful
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: sphinx
